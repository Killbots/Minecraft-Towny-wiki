<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | ModernMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --nav: #000000;
    --cyan: #1fc6e6;
    --cyan-soft: #3fd0f0;
    --blue: #1f6fd1;
    --blue-hi: #2b8fe0;
    --body: #2a2a2a;
    --card: #323232;
    --card-line: #434343;
    --text: #d6d9dd;
    --muted: #a7acb2;
    --white: #ffffff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Open Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    color: var(--text);
    background: var(--body);
    line-height: 1.6;
    min-height: 100vh;
  }
  h1, h2, h3, .serif { font-family: "Marcellus", Georgia, serif; font-weight: 400; color: var(--white); margin: 0; line-height: 1.15; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* ---------- Top nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: var(--nav);
    display: flex; align-items: stretch; justify-content: space-between;
    min-height: 60px; padding: 0 1.2rem;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--cyan); font-family: "Marcellus", serif; font-size: 1.35rem; }
  .brand .badge-mmc {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2aa7c9, #0d4f66);
    border: 2px solid #22c3e6;
    box-shadow: 0 0 12px rgba(31,198,230,.55);
    display: grid; place-items: center;
    font: 700 .62rem "Open Sans", sans-serif; font-style: italic; color: #e9fbff; letter-spacing: .02em;
  }
  .links { display: flex; align-items: stretch; list-style: none; margin: 0; padding: 0; }
  .links a {
    display: flex; align-items: center; gap: .4rem; height: 100%;
    padding: 0 .95rem; text-decoration: none; color: var(--white);
    font-weight: 600; font-size: .95rem; transition: background .15s ease;
  }
  .links a:hover { background: #111; }
  .links a[aria-current="page"] { background: var(--cyan); color: #fff; }
  .links svg { width: 14px; height: 14px; fill: currentColor; }
  .menu-toggle { display: none; background: none; border: 0; color: var(--white); font-size: 1.6rem; cursor: pointer; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; text-align: center;
    padding: 4.5rem 1.25rem 3.75rem;
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 78% 18%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 88% 66%, rgba(255,255,255,.5), transparent),
      linear-gradient(180deg, #072038 0%, #0c3358 55%, #15507f 100%);
  }
  .eyebrow {
    display: block; color: var(--cyan-soft); letter-spacing: .22em; text-transform: uppercase;
    font-size: .95rem; font-weight: 600; margin-bottom: .6rem;
  }
  .hero h1 { font-size: clamp(2.2rem, 5.4vw, 3.6rem); }
  .hero p { max-width: 640px; margin: 1rem auto 0; font-size: 1.1rem; color: #e4e9ef; }
  .hero .cta { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 1.8rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .45rem; text-decoration: none;
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    color: var(--white); font-weight: 700; padding: .7rem 1.25rem; border-radius: 3px;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: rgba(0,0,0,.35); color: var(--text); font-weight: 600;
    border: 1px solid #3c5878;
  }
  .btn.ghost:hover { border-color: var(--cyan); color: var(--white); }
