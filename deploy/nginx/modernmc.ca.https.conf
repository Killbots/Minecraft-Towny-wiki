# Final HTTPS wiki site. Install after issuing a certificate for both names.
# Certificate paths are created by Certbot using the webroot method below.
server {
    listen 80;
    listen [::]:80;
    server_name modernmc.ca www.modernmc.ca;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/modernmc.ca;
        try_files $uri =404;
    }

    location / {
        return 301 https://modernmc.ca$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modernmc.ca;

    root /var/www/modernmc.ca;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/modernmc.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modernmc.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.modernmc.ca;

    ssl_certificate /etc/letsencrypt/live/modernmc.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modernmc.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://modernmc.ca$request_uri;
}
