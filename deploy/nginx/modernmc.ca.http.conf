# Temporary HTTP site used to serve the wiki and complete the ACME challenge.
# Install as /etc/nginx/conf.d/modernmc.ca.conf before requesting the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name modernmc.ca www.modernmc.ca;

    root /var/www/modernmc.ca;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
